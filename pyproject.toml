[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "umbra"
version = "0.1.0"
description = "RAG coverage cartography: maps the blind spots of a RAG system."
requires-python = ">=3.11"
license = "MIT"
dynamic = ["dependencies"]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "ruff"]

[project.scripts]
umbra = "src.cli:cli"

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]
markers = [
    "postgres: requires a Postgres+pgvector database (POSTGRES_DSN)",
    "qdrant: requires a Qdrant server (QDRANT_URL)",
]
